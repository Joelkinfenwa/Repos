<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('year').textContent = new Date().getFullYear();

  // Mobile menu
  var menuBtn = document.getElementById('menuBtn');
  var mobileMenu = document.getElementById('mobileMenu');
  menuBtn.addEventListener('click', function () {
    var open = mobileMenu.classList.toggle('hidden') === false;
    menuBtn.setAttribute('aria-expanded', String(open));
  });
  mobileMenu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { mobileMenu.classList.add('hidden'); menuBtn.setAttribute('aria-expanded','false'); });
  });

  // Reveal on scroll
  var revealEls = document.querySelectorAll('.reveal');
  if (reduce || !('IntersectionObserver' in window)) {
    revealEls.forEach(function (el) { el.classList.add('in'); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    revealEls.forEach(function (el) { io.observe(el); });
  }

  // Form validation
  var form = document.getElementById('leadForm');
  function showError(input, show) {
    var wrap = input.closest('div');
    var err = wrap ? wrap.querySelector('.err') : null;
    if (err) err.classList.toggle('hidden', !show);
    input.classList.toggle('border-danger', show);
    input.classList.toggle('border-line', !show);
  }
  function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  ['company','name','email','orgtype'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('blur', function () {
      var bad = id === 'email' ? !validEmail(el.value) : !el.value.trim();
      showError(el, bad);
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var company = document.getElementById('company');
    var name = document.getElementById('name');
    var email = document.getElementById('email');
    var orgtype = document.getElementById('orgtype');

    var errs = [];
    if (!company.value.trim()) { showError(company, true); errs.push(company); }
    if (!name.value.trim()) { showError(name, true); errs.push(name); }
    if (!validEmail(email.value)) { showError(email, true); errs.push(email); }
    if (!orgtype.value) { showError(orgtype, true); errs.push(orgtype); }
    if (errs.length) { errs[0].focus(); return; }

    var btn = document.getElementById('submitBtn');
    function setLoading(on) {
      btn.disabled = on;
      btn.querySelector('.btn-label').textContent = on ? 'Sending…' : 'Book a partner call';
      btn.querySelector('.btn-spin').classList.toggle('hidden', !on);
    }
    function showSuccess() {
      document.getElementById('formBody').classList.add('hidden');
      var ok = document.getElementById('formSuccess');
      ok.classList.remove('hidden');
      ok.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    }
    function showSendError() {
      setLoading(false);
      var box = document.getElementById('formError');
      box.classList.remove('hidden');
      box.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    }

    setLoading(true);
    document.getElementById('formError').classList.add('hidden');

    var action = form.getAttribute('action') || '';

    // Not configured yet → demo mode so the page still behaves while you set up Formspree.
    if (action.indexOf('YOUR_FORM_ID') !== -1) {
      console.warn('[Express] Form endpoint not configured. Replace YOUR_FORM_ID in the form action with your Formspree form ID to receive enquiries by email.');
      setTimeout(function () { setLoading(false); showSuccess(); }, 800);
      return;
    }

    // Real submission to Formspree (or any endpoint that accepts a POST + returns JSON).
    fetch(action, {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new FormData(form)
    }).then(function (res) {
      if (res.ok) { showSuccess(); }
      else { res.json().then(function () { showSendError(); }).catch(showSendError); }
    }).catch(showSendError);
  });
})();
</script>

<script>
(function(){

  window.addEventListener('load',H);window.addEventListener('resize',H);
  if(window.ResizeObserver){try{new ResizeObserver(H).observe(document.body);}catch(e){}}
  [150,500,1200,2500].forEach(function(t){setTimeout(H,t);});
  document.addEventListener('click',function(e){
    var a=e.target.closest&amp;&amp;e.target.closest('a[href^=\&quot;#\&quot;]');
    if(!a)return;var id=(a.getAttribute('href')||'').slice(1);if(!id)return;
    var el=document.getElementById(id);if(!el)return;
    e.preventDefault();
    var top=el.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0);
    if(window.parent)window.parent.postMessage({eppScrollTo:top},'*');
  },true);
})();
</script>
